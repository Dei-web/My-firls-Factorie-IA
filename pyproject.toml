[project]
name = "factorie-ia"
version = "0.1.0"
description = "factorie for create webs"
readme = "README.md"
authors = [
    { name = "Dei-web", email = "deilerc27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.7.1",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
]

[project.scripts]
factorie-ia = "factorie_ia:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
